<section class="goal">
  <article class="goal-card">
    <div class="goal-card__icon">
      <i data-lucide="target"></i>
    </div>

    <div class="goal-card__content">
      <p class="goal-card__label">Моя ціль</p>
      <h3 class="goal-card__title">Автомобіль</h3>

      <div class="goal-card__progress">
        <div class="goal-card__progress-bar"></div>
      </div>
    </div>

    <div class="goal-card__amount">
      <p class="goal-card__current">₴ 120 000</p>
      <p class="goal-card__total">з ₴ 300 000</p>
    </div>

    <i class="goal-card__arrow" data-lucide="chevron-right"></i>
  </article>
</section>
